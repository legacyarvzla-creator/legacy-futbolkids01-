<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST DE CONTROL</title>
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.1/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
    <div style="position:fixed; top:20px; z-index:9999;">
        <button onclick="testFlash()">PROBAR FLASH</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" renderer="preserveDrawingBuffer: true" vr-mode-ui="enabled: false">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>

    <script>
        // Esta función aísla el problema del Flash
        async function testFlash() {
            try {
                // Buscamos el stream de la cámara de MindAR
                const scene = document.querySelector('a-scene');
                const videoEl = scene.querySelector('video'); // El video nativo que crea MindAR
                const stream = videoEl.srcObject;
                const track = stream.getVideoTracks()[0];
                
                // Intentamos encender el flash
                await track.applyConstraints({ advanced: [{ torch: true }] });
                alert("Flash encendido con éxito");
            } catch (e) {
                alert("Error: " + e.message + ". ¿Estás en HTTPS?");
            }
        }
    </script>
</body>
</html>
