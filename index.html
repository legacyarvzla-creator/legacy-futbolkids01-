<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>legacyfutbolkids - MultiTarget 9:16 Corregido</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; font-family: sans-serif; }
        #ui { position: absolute; z-index: 9999; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 25px; padding: 12px 25px; background: rgba(0, 0, 0, 0.6); border-radius: 50px; backdrop-filter: blur(10px); }
        .btn-circular { width: 60px; height: 60px; border-radius: 50%; border: 2px solid white; background: rgba(0, 0, 0, 0.4); color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #miVideo { position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div id="ui">
        <button id="recordButton" class="btn-circular">REC</button>
        <button id="torchButton" class="btn-circular">FLASH</button>
    </div>

    <video id="miVideo" src="./video.mp4" loop="true" playsinline webkit-playsinline crossorigin="anonymous"></video>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: no; uiLoading: no;" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" renderer="antialias: true; alpha: true;">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="target0" mindar-image-target="targetIndex: 0"></a-entity>
        <a-entity id="target1" mindar-image-target="targetIndex: 1"></a-entity>
        <a-entity id="target2" mindar-image-target="targetIndex: 2"></a-entity>

        <a-entity id="videoContainer" visible="false">
            <a-video src="#miVideo" width="1" height="1.777" rotation="0 0 0"></a-video>
        </a-entity>
    </a-scene>

    <script>
        const video = document.querySelector('#miVideo');
        const videoContainer = document.querySelector('#videoContainer');
        const targets = [document.querySelector('#target0'), document.querySelector('#target1'), document.querySelector('#target2')];
        
        let detectados = 0;

        targets.forEach((target) => {
            target.addEventListener("targetFound", () => {
                detectados++;
                // Movemos el contenedor al target encontrado usando el objeto 3D del target
                target.object3D.add(videoContainer.object3D);
                videoContainer.setAttribute('visible', 'true');
                video.play();
            });

            target.addEventListener("targetLost", () => {
                detectados--;
                if (detectados <= 0) {
                    video.pause();
                    videoContainer.setAttribute('visible', 'false');
                }
            });
        });

        // Asegurar audio al tocar cualquier parte
        window.addEventListener('click', () => { video.play(); }, {once: true});
    </script>
</body>
</html>
